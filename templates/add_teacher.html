<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Teacher | EduCloud</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #172554, transparent 35%),
                radial-gradient(circle at bottom right, #312e81, transparent 35%),
                #050816;
            color: white;
            padding: 30px;
        }

        .navbar {
            max-width: 1100px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 10px 18px;
            border-radius: 10px;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .card {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.35);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #a5b4fc;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #e5e7eb;
        }

        input,
        select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25);
            color: white;
            outline: none;
            font-size: 15px;
        }

        select option {
            background: #111827;
            color: white;
        }

        input:focus,
        select:focus {
            border-color: #818cf8;
        }

        .error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:hover {
            background: #4f46e5;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <div class="logo">
            EduCloud
        </div>

        <a href="/admin" class="back-btn">
            ← Back to Admin
        </a>

    </div>


    <div class="container">

        <div class="card">

            <h1>Add New Teacher</h1>

            <p class="subtitle">
                Create a teacher account and assign a branch.
            </p>


            {% if error %}

                <div class="error">
                    {{ error }}
                </div>

            {% endif %}


            <form action="/admin/add-teacher"
                  method="POST">


                <div class="form-group">

                    <label>
                        Teacher Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter teacher name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Assign Branch
                    </label>

                    <select name="branch_id"
                            required>

                        <option value="">
                            Select Branch
                        </option>

                        {% for branch in branches %}

                            <option value="{{ branch.id }}">
                                {{ branch.name }}
                            </option>

                        {% endfor %}

                    </select>

                </div>


                <button
                    type="submit"
                    class="btn">

                    Create Teacher

                </button>

            </form>

        </div>

    </div>

</body>

</html>
